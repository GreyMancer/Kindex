<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindex - Wildkin Catalog</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --primary: #2b7a78;
            --primary-hover: #17252a;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0 0 5px 0;
            color: var(--primary);
            font-size: 2.8rem;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"], select {
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #dee2e6;
            border-radius: var(--radius);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 280px;
            max-width: 100%;
            background: white;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(43, 122, 120, 0.15);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .card img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .card .number {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: bold;
        }

        .card h3 {
            margin: 5px 0 12px 0;
            font-size: 1.25rem;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Type Colors */
        .type-normal { background-color: #A8A878; }
        .type-fire { background-color: #F08030; }
        .type-water { background-color: #6890F0; }
        .type-grass { background-color: #78C850; }
        .type-electric { background-color: #F8D030; color: #212529; }
        .type-ice { background-color: #98D8D8; color: #212529; }
        .type-fighting { background-color: #C03028; }
        .type-poison { background-color: #A040A0; }
        .type-ground { background-color: #E0C068; color: #212529; }
        .type-flying { background-color: #A890F0; }
        .type-psychic { background-color: #F85888; }
        .type-bug { background-color: #A8B820; }
        .type-rock { background-color: #B8A038; }
        .type-ghost { background-color: #705898; }
        .type-dragon { background-color: #7038F8; }
        .type-dark { background-color: #705848; }
        .type-steel { background-color: #B8B8D0; color: #212529; }
        .type-fairy { background-color: #EE99AC; color: #212529; }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: var(--radius);
            max-width: 480px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: var(--text-main);
        }

        /* Stat Bars Styling */
        .stats-container {
            margin-top: 20px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }

        .stats-container h4 {
            margin: 0 0 12px 0;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .stat-name {
            width: 90px;
            font-weight: bold;
            color: var(--text-muted);
        }

        .stat-value {
            width: 35px;
            text-align: right;
            font-weight: bold;
        }

        .stat-bar-bg {
            flex-grow: 1;
            background-color: #e2e8f0;
            border-radius: 4px;
            height: 8px;
            margin-left: 10px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            background-color: var(--primary);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Kindex</h1>
        <p>Explore and search the official Wildkin catalog!</p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by name or number..." oninput
