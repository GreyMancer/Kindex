<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindex</title>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --primary: #e3350d;
            --primary-hover: #c22e0a;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0 0 10px 0;
            color: var(--primary);
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"], select, input[type="number"] {
            padding: 10px 16px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: var(--radius);
            outline: none;
            transition: border-color 0.2s;
            width: 250px;
            max-width: 100%;
        }

        input[type="text"]:focus, select:focus, input[type="number"]:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .card .number {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: bold;
        }

        .card h3 {
            margin: 5px 0 10px 0;
            font-size: 1.2rem;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
        }

        /* Type Colors */
        .type-fire { background-color: #F08030; }
        .type-water { background-color: #6890F0; }
        .type-grass { background-color: #78C850; }
        .type-electric { background-color: #F8D030; color: #333; }
        .type-normal { background-color: #A8A878; }
        .type-poison { background-color: #A040A0; }
        .type-ghost { background-color: #705898; }
        .type-psychic { background-color: #F85888; }
        .type-dragon { background-color: #7038F8; }
        .type-fighting { background-color: #C03028; }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: var(--radius);
            max-width: 450px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content img {
            width: 140px;
            height: 140px;
            object-fit: contain;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Stat Bars Styling */
        .stats-container {
            margin-top: 20px;
            text-align: left;
        }

        .stats-container h4 {
            margin: 0 0 10px 0;
            text-align: center;
            font-size: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .stat-name {
            width: 90px;
            font-weight: bold;
            color: var(--text-muted);
        }

        .stat-value {
            width: 35px;
            text-align: right;
            font-weight: bold;
        }

        .stat-bar-bg {
            flex-grow: 1;
            background-color: #e9ecef;
            border-radius: 4px;
            height: 8px;
            margin-left: 10px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            background-color: var(--primary);
            border-radius: 4px;
        }

        /* Form styling for adding Fakemon */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            box-sizing: border-box;
        }

        .form-group textarea {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: var(--radius);
            font-family: inherit;
            resize: vertical;
            height: 80px;
            outline: none;
        }

        .form-group textarea:focus {
            border-color: var(--primary);
        }

        .stats-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stats-inputs .form-group {
            margin-bottom: 10px;
        }

        .stats-inputs input {
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>Kindex</h1>
        <p>Explore, search, and manage your custom Fakemon catalog!</p>
        <button class="btn" onclick="openAddModal()">+ Add New Fakemon</button>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by name or number..." oninput="filterFakemon()">
        <select id="typeFilter" onchange="filterFakemon()">
            <option value="">All Types</option>
            <option value="Fire">Fire</option>
            <option value="Water">Water</option>
